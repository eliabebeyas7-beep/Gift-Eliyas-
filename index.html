<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Eliyas</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:30px 16px}.card{width:100%;max-width:520px;background:#111;border:1px solid #2b2b2b;border-radius:24px;padding:28px;box-shadow:0 20px 60px #000}.logo{font-size:28px;font-weight:800;letter-spacing:4px;text-align:center;color:#d7ad45}.sub{text-align:center;color:#aaa;margin:8px 0 28px}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.amount{padding:14px 6px;border:1px solid #444;background:#181818;color:#fff;border-radius:12px;font-size:16px;cursor:pointer}.amount.active{border-color:#d7ad45;color:#d7ad45}.label{display:block;margin:20px 0 8px;color:#ccc}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#181818;color:#fff;font-size:16px;outline:none}.selected{margin:20px 0;text-align:center;font-size:22px;color:#d7ad45;font-weight:700}.gift{width:100%;padding:16px;border:0;border-radius:13px;background:#d7ad45;color:#080808;font-size:18px;font-weight:800;cursor:pointer}.tele{margin-top:22px;padding:18px;border-radius:15px;background:#181818;border:1px solid #333;text-align:center}.number{font-size:25px;font-weight:800;color:#d7ad45;letter-spacing:2px;margin:8px}.note{color:#aaa;font-size:13px;line-height:1.5}.msg{margin-top:15px;text-align:center;color:#ddd}.hidden{display:none}</style></head><body><main class="card"><div class="logo">GIFT ELIYAS</div><div class="sub">Send a gift through Telebirr</div><div class="amounts"><button class="amount" data-v="5">5 ETB</button><button class="amount" data-v="10">10 ETB</button><button class="amount" data-v="20">20 ETB</button><button class="amount" data-v="50">50 ETB</button><button class="amount" data-v="100">100 ETB</button><button class="amount" data-v="200">200 ETB</button><button class="amount" data-v="500">500 ETB</button><button class="amount" data-v="1000">1,000 ETB</button></div><label class="label">Custom Amount (ETB)</label><input id="custom" class="input" type="number" min="1" placeholder="Enter amount"><label class="label">Your name (optional)</label><input id="name" class="input" placeholder="Your name"><div id="selected" class="selected">Select an amount</div><button id="gift" class="gift">Gift Eliyas</button><section id="tele" class="tele hidden"><div>Send your gift to Telebirr</div><div class="number">0900153777</div><div class="note">Open Telebirr → send the selected amount to the number above. Then return here and confirm that you have paid.</div><button id="paid" class="gift" style="margin-top:14px">I Have Paid</button></section><div id="msg" class="msg"></div></main><script>let amount=0;const selected=document.getElementById('selected'),custom=document.getElementById('custom'),tele=document.getElementById('tele'),msg=document.getElementById('msg');function setAmount(v){amount=Number(v);document.querySelectorAll('.amount').forEach(b=>b.classList.toggle('active',Number(b.dataset.v)===amount));custom.value='';selected.textContent=amount?amount.toLocaleString()+' ETB':'Select an amount'}document.querySelectorAll('.amount').forEach(b=>b.onclick=()=>setAmount(b.dataset.v));custom.oninput=()=>{if(custom.value){amount=Number(custom.value);document.querySelectorAll('.amount').forEach(b=>b.classList.remove('active'));selected.textContent=amount.toLocaleString()+' ETB'}};document.getElementById('gift').onclick=()=>{if(!amount||amount<1){msg.textContent='Please select or enter an amount.';return}msg.textContent='';tele.classList.remove('hidden');tele.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('paid').onclick=()=>{msg.textContent='Thank you! Your gift confirmation has been received. ❤️';};</script></body></html>
